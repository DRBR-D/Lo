<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Ảnh Nội Bộ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📸 Thư Viện Ảnh Nội Bộ</h1>
        <p>Kho lưu trữ và chia sẻ khoảnh khắc</p>
    </header>

    <main>
        <section class="upload-section">
            <h2>Tải ảnh mới lên</h2>
            <div class="upload-box">
                <input type="file" id="imageInput" accept="image/*">
                <button id="uploadBtn" onclick="uploadImage()">Tải Lên Firebase</button>
            </div>
            <p id="statusMessage" class="status-msg"></p>
        </section>

        <section class="gallery-section">
            <h2>Tất cả hình ảnh</h2>
            <div id="gallery" class="gallery-grid">
                <!-- Ảnh sẽ tự động hiển thị real-time tại đây -->
            </div>
        </section>
    </main>

    <!-- Lưu ý: Phải có type="module" thì mới dùng được import Firebase -->
    <script type="module" src="app.js"></script>
</body>
</html>
