<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Ảnh Realtime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📸 Thư Viện Ảnh Realtime</h1>
        <p>Lưu trữ & đồng bộ ảnh tức thì qua Realtime Database</p>
    </header>

    <main>
        <section class="upload-section">
            <h2>Tải ảnh mới lên</h2>
            <div class="upload-box">
                <input type="file" id="imageInput" accept="image/*">
                <button id="uploadBtn" onclick="uploadImage()">Tải Lên</button>
            </div>
            <p id="statusMessage" class="status-msg"></p>
        </section>

        <section class="gallery-section">
            <h2>Tất cả hình ảnh</h2>
            <div id="gallery" class="gallery-grid">
                <!-- Dữ liệu real-time tự load ở đây -->
            </div>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
